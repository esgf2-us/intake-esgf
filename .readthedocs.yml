version: 2

build:
  os: ubuntu-lts-latest
  tools:
    python: "3.14"
    nodejs: "latest"
  jobs:
    install:
      - asdf plugin add pandoc
      - asdf plugin add uv
      - asdf install uv latest
      - asdf global uv latest
      - uv sync --group docs
    build:
      html:
        - cd doc && uv run myst build --html --execute
    post_build:
      - mkdir --parents $READTHEDOCS_OUTPUT/html/
      - cp --recursive doc/_build/html/* $READTHEDOCS_OUTPUT/html/
      - pandoc doc/cheatsheet.md -o $READTHEDOCS_OUTPUT/html/cheatsheet.pdf
